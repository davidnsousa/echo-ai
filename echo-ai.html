<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Only the Response area of the popup; everything around it is native GTK.
     Colours come from the GTK theme via init(), and the page background is
     transparent so the GTK card behind it shows through. -->
<style>
  :root {
    --fg: #e6e8ee; --muted: rgba(230, 232, 238, .6); --accent: #78aeed; --error: #ff7b63;
    --line: rgba(255, 255, 255, .1); --tint: rgba(255, 255, 255, .04);
    --ui: "DejaVu Sans", system-ui, sans-serif;
    /* NL = no ligatures, so >= shows as typed rather than as a ≥ glyph. */
    --mono: "JetBrainsMonoNL Nerd Font", "JetBrains Mono NL", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--fg);
               font: 13px/1.55 var(--ui); }
  body { overflow: auto; padding: 12px 16px; }
  ::selection { background: var(--accent); color: #fff; }
  body.placeholder { color: var(--muted); }
  body.error { color: var(--error); white-space: pre-wrap; }

  #out > :first-child { margin-top: 0; }
  #out > :last-child { margin-bottom: 0; }
  p, ul, ol, blockquote, table, .code { margin: 0 0 10px; }
  h1, h2, h3, h4 { margin: 16px 0 8px; line-height: 1.3; }
  h1 { font-size: 18px; } h2 { font-size: 16px; } h3, h4 { font-size: 14px; }
  ul, ol { padding-left: 22px; }
  li { margin: 3px 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  :not(pre) > code { font: 12px var(--mono); background: var(--tint); border: 1px solid var(--line);
                     border-radius: 5px; padding: 1px 5px; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  th { background: var(--tint); }
  .code { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: rgba(0, 0, 0, .25); }
  .code-head { display: flex; align-items: center; justify-content: space-between;
               padding: 3px 4px 3px 12px; border-bottom: 1px solid var(--line);
               color: var(--muted); font-size: 12px; }
  .code-head button { font: 12px var(--ui); color: var(--muted); background: transparent; border: 0;
                      border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .code-head button:hover { color: var(--fg); background: var(--tint); }
  pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 12.5px/1.55 var(--mono); }
  pre code { font: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
<style id="pygments"></style>
</head>
<body class="placeholder"><div id="out"></div>
<script>
  const out = document.getElementById("out");
  const post = (action, data = {}) =>
    window.webkit.messageHandlers.echo_ai.postMessage(JSON.stringify({ action, ...data }));

  // --- Called from Python -------------------------------------------------
  function init(cfg) {
    for (const [name, value] of Object.entries(cfg.colors))
      document.documentElement.style.setProperty(`--${name}`, value);
    document.getElementById("pygments").textContent = cfg.pygmentsCss;
  }

  function setPlaceholder(text) {
    document.body.className = "placeholder";
    out.textContent = text;
  }

  function setResponse(html, streaming) {
    const b = document.scrollingElement;
    const atBottom = b.scrollHeight - b.scrollTop - b.clientHeight < 40;
    document.body.className = "";
    out.innerHTML = html;
    out.querySelectorAll("pre").forEach(addCodeHeader);
    if (streaming && atBottom) b.scrollTop = b.scrollHeight;
  }

  function setError(text) {
    document.body.className = "error";
    out.textContent = text;
  }

  // Each code block gets a header with its language and a Copy button.
  function addCodeHeader(pre) {
    const code = pre.querySelector("code");
    const lang = ((code && code.className.match(/language-(\S+)/)) || [])[1] || "code";
    const wrap = document.createElement("div");
    wrap.className = "code";
    const head = document.createElement("div");
    head.className = "code-head";
    const name = document.createElement("span");
    name.textContent = lang;
    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.onclick = () => {
      post("copy", { text: (code || pre).innerText });
      copy.textContent = "Copied ✓";
      setTimeout(() => (copy.textContent = "Copy"), 1200);
    };
    head.append(name, copy);
    pre.replaceWith(wrap);
    wrap.append(head, pre);
  }

  document.addEventListener("keydown", (e) => { if (e.key === "Escape") post("close"); });
  post("ready");
</script>
</body>
</html>
